# [OpenTelemetry Collector 설정]
# - API 요청으로 인해 어느 모듈을 거쳐갔는지의 기록 데이터를 받아서, Tempo에게 넘겨주는 역할

# Spring Boot의 트레이스를 otlp라는 정해진 규격에 담기
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

# 트레이스 데이터를 모았다가 한 번에 묶어서 전송
processors:
  batch:

# 데이터를 어디로 보낼지 결정 (Tempo 컨테이너 포트로 전송)
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

# 위에서 정의한 3단계를 파이프라인으로 연결 (otlp로 받아서 → batch로 처리하고 → tempo로 전송)
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]