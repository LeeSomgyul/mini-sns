<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  html, body { height: 100%; overflow: hidden; }
  input::placeholder, textarea::placeholder { color: #a7a7ae; }
</style>
<script>
  function fitStage() {
    var el = document.getElementById('stage-1920');
    if (!el) return;
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    el.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('DOMContentLoaded', fitStage);
  setTimeout(fitStage, 0);
</script>
</helmet>
<div style="position:fixed; inset:0; width:100vw; height:100vh; overflow:hidden; background:#e9e9eb;">
<div id="stage-1920" style="position:absolute; top:50%; left:50%; width:1920px; height:1080px; transform:translate(-50%,-50%); overflow:hidden; background:
    radial-gradient(circle at 8% 10%, rgba(92,200,241,0.4), transparent 42%),
    radial-gradient(circle at 92% 8%, rgba(247,220,163,0.42), transparent 44%),
    radial-gradient(circle at 15% 92%, rgba(214,222,159,0.38), transparent 44%),
    radial-gradient(circle at 88% 88%, rgba(238,199,211,0.42), transparent 44%),
    #f0f0f2;">

  <!-- dimmed blur layer -->
  <div style="position:absolute; inset:0; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); background:rgba(20,20,28,0.18);"></div>

  <!-- LEFT NAV -->

    </div>

    </div>
    <div style="width:52px; height:52px; border-radius:18px; background:rgba(255,255,255,0.5); display:flex; align-items:center; justify-content:center;">

    </div>
    <div style="width:52px; height:52px; border-radius:18px; background:rgba(255,255,255,0.5); display:flex; align-items:center; justify-content:center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="#b0b0b8" stroke-width="1.8"></circle><path d="M19 12a7 7 0 00-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 00-2-1.2L14 3h-4l-.6 2.6a7 7 0 00-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 005 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9c.6.5 1.3.9 2 1.2L10 21h4l.6-2.6c.7-.3 1.4-.7 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z" stroke="#b0b0b8" stroke-width="1.4" stroke-linejoin="round"></path></svg>
    </div>
  </div><div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 1000px; height: 665px; border-radius: 32px; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); box-shadow: 0px 30px 70px 0px #FFFFFF2E; padding: 28px; display: flex; flex-direction: column; border-width: 1px; border-style: solid; border-color: #FFFFFF; background-color: #FFFFFF25">

    

    <!-- inner white glass card -->
    
  <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 980px; height: 640px; border-radius: 32px; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); box-shadow: 0px 30px 70px 0px #FFFFFF2E; padding: 28px; display: flex; flex-direction: column; background-color: #FFFFFF5B">

      <div style="width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; background-color: #FFFFFFC7">

      </div>
    </div>

    <!-- inner white glass card -->

      <div style="display:flex; gap:20px; flex:1; min-height:0;">

        <!-- media upload -->

          <div style="display:flex; align-items:center; justify-content:space-between;">

            <div style="display:flex; gap:6px;">
              <div style="width: 30px; height: 30px; border-radius: 10px; border: 1px solid #e6e6e9; display: flex; align-items: center; justify-content: center; cursor: pointer; background-color: #F4F4F6; border-style: none">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="width: 18px; height: 18px"><path d="M12 5v14M5 12h14" stroke="#3a3a41" stroke-width="2" stroke-linecap="round"></path></svg>

            <div style="width: 68px; height: 68px; border-radius: 10px; background: #ffffff; border: 1.5px solid #5cc8f1; border-style: solid; border-width: 1px; border-color: #000000"></div>
            <div style="width: 68px; height: 68px; border-radius: 10px; background: #ffffff; border-style: solid; border-width: 1px; border-color: #000000"></div>
            <div style="width: 68px; height: 68px; border-radius: 10px; background: #ffffff; border-style: solid; border-width: 1px; border-color: #000000"></div>
            <div style="width: 68px; height: 68px; border-radius: 10px; background: #ffffff; border-style: solid; border-width: 1px; border-color: #000000"></div>
            <div style="width: 68px; height: 68px; border-radius: 10px; background: #ffffff; border-style: solid; border-width: 1px; border-color: #000000"></div>
          </div>
        </div>

        <!-- text write -->
        <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <span style="font-size: 13.5px; font-weight: 600; color: #1c1c21; margin-bottom: 8px; margin-top: 4px">글 작성</span>
            <span style="font-size: 12px; color: #000000; margin-left: 3px; margin-right: 3px">0 / 500</span>
          </div><textarea placeholder="어떤 일이 있었나요?" style="flex: 1; border: none; border-radius: 16px; background: #ffffff; padding: 14px 16px; font-size: 13.5px; color: #3a3a41; outline: none; resize: none; border-color: #000000; border-style: solid; border-width: 1px; width: 258px; height: 425px"></textarea>
          
        </div>

        <!-- tags -->
        <div style="width:230px; flex-shrink:0; display:flex; flex-direction:column; gap:10px;">
          <span style="font-size: 13.5px; font-weight: 600; color: #1c1c21; margin-top: 4px; margin-bottom: 8px">태그</span>
          <div style="height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 12.5px; color: #FFFFFF; cursor: pointer; background-color: #000000">태그 추가</div>
          <div style="display: flex; align-items: center; gap: 8px; background: #ffffff; border-radius: 12px; padding: 8px 10px; border-width: 0.5px; border-style: solid; border-color: #000000">

            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; background: #ffffff; border-radius: 12px; padding: 8px 10px; border-width: 0.5px; border-style: solid; border-color: #000000">
            <div style="width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,#f7dca3,#d6de9f); flex-shrink:0;"></div>
            <span style="font-size: 12.5px; color: #B8B8B8; flex: 1"><span style="color: #474747; font-weight: 600">치킨이닭</span> 최서현</span>
            <div style="width:24px; height:24px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="width: 15px; height: 15px"><path d="M6 6l12 12M18 6L6 18" stroke="#c2c2c8" stroke-width="2" stroke-linecap="round"></path></svg>
            </div>
          </div>
        </div>

      </div>

      <div style="display:flex; justify-content:flex-end;">
        <button style="height: 40px; padding: 0 26px; border-radius: 12px; border: none; color: #000000; font-size: 13.5px; font-weight: 600; cursor: pointer; background-color: #58F586">저장</button>
      </div>

    </div>
  </div></div>

  <!-- MODAL: outer glass card -->
  

</div>
</div>

</x-dc>
</body>
</html>
