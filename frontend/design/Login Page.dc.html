<x-dc>
<helmet>
<style>
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #ffffff; }
  @keyframes auroraShift {
    0%, 100% { background-position: 0% 0%, 100% 0%, 0% 100%, 100% 100%; }
    50% { background-position: 20% 30%, 80% 20%, 25% 80%, 75% 75%; }
  }
  @keyframes zigLeft {
    0% { transform: translate(0, 460px); opacity: 0; }
    8% { opacity: 1; }
    45% { transform: translate(0, 60px); opacity: 1; }
    82% { transform: translate(0, -220px); opacity: 1; }
    100% { transform: translate(0, -420px); opacity: 0; }
  }
  @keyframes typeIn {
    0%, 40% { width: 0%; }
    58%, 100% { width: 100%; }
  }
  @keyframes heartPop {
    0%, 42% { transform: translateY(0) scale(0); opacity: 0; }
    50% { transform: translateY(-14px) scale(1.1); opacity: 1; }
    62% { transform: translateY(-38px) scale(0.95); opacity: 1; }
    78% { transform: translateY(-70px) scale(0.9); opacity: 0; }
    100% { opacity: 0; }
  }
  @keyframes bubbleIn {
    0%, 44% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.08); opacity: 1; }
    58%, 100% { transform: scale(1); opacity: 1; }
  }
</style>
</helmet>
