# ------------------------------------------------
#              AWS 배포용 nginx 설정    
# ------------------------------------------------
user                 nginx; 
worker_processes     auto;
worker_rlimit_nofile 65535;

events {
    multi_accept       on;
    worker_connections 65535;
}

http {
    charset                utf-8;
    sendfile               on; 
    tcp_nopush             on;
    tcp_nodelay            on;
    server_tokens          off; 
    client_max_body_size   16M; 

    include                mime.types;
    default_type           application/octet-stream;

    # [Gzip] 텍스트 압축 설정 적용
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # [imgproxy] 미디어 캐시 창고 설정
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=img_cache:10m max_size=1g inactive=60m use_temp_path=off;

    server {
        listen 80;
        server_name api.mysite.com; # 🚨 실제 구매한 도메인의 API 서브도메인으로 교체

        # 에러 로그 출력    
        error_log  /var/log/nginx/error.log debug;

        # -------------------------------------------------------------
        # [내부 모듈 통신용 API에 대한 외부(클라이언트) 접근 차단]
        # -------------------------------------------------------------
        # 프론트 요청 중 /internal 요청이 들어오면 403 에러를 띄워줍니다. 
        location ~ ^/api/v1/internal/ {
            return 403;
        }

        # -------------------------------------------------------------
        # [1. USER 모듈 전용 통로 - 8081 포트]
        # -------------------------------------------------------------
        # 프론트가 /api/v1/auth나 /api/v1/users로 보낸 요청을 8081로 배달합니다.
        location ~ ^/api/v1/(auth|users|follows) {
            proxy_pass http://user-module:8081; 
            proxy_cache off;                                      
            
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -------------------------------------------------------------
        # [2. POST 모듈 전용 통로 - 8082 포트]
        # -------------------------------------------------------------
        # 프론트가 /api/v1/posts or /api/v1/media or /api/v1/comments 으로 보낸 요청을 8082로 배달합니다.
        location ~ ^/api/v1/(posts|media|comments) {
            proxy_pass http://post-module:8082; 
            proxy_cache off;                                      
            
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -------------------------------------------------------------
        # [3. USER_SEARCH 모듈 전용 통로 - 8083 포트]
        # -------------------------------------------------------------
        # 프론트가 /api/v1/search로 보낸 요청을 8083로 배달합니다.
        location ~ ^/api/v1/search {
            proxy_pass http://usersearch-module:8083; 
            proxy_cache off;                                      
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -------------------------------------------------------------
        # [4. FEED 모듈 전용 통로 - 8084 포트]
        # -------------------------------------------------------------
        # 프론트가 /api/v1/feed로 보낸 요청을 8084로 배달합니다.
        location ~ ^/api/v1/feed {
            proxy_pass http://feed-module:8084; 
            proxy_cache off;                                      
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -------------------------------------------------------------
        # [5. NOTIFICATION 모듈 전용 통로 - 8085 포트]
        # -------------------------------------------------------------
        # - location: 프론트엔드에서 쏘는 주소
        # - proxy_pass: 백엔드에서 실행되는 주소
        location ~ ^/api/v1/notifications/connect {
            proxy_pass http://notification-module:8085; 
            
            proxy_buffering off;        
            proxy_cache off;            
            proxy_set_header Connection ''; 
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # -------------------------------------------------------------
        #   imgproxy 이미지 가공 및 캐싱 경로
        # -------------------------------------------------------------
        location /insecure/ {
            proxy_pass http://imgproxy:8080;

            add_header 'Access-Control-Allow-Origin' 'https://mysite.com' always;  # 🚨 실제 프론트 도메인으로 교체

            proxy_cache img_cache;
            proxy_cache_valid 200 302 60m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;
        }
    }
}